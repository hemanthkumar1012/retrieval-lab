name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  # Runs the retrieval, cache and rate-limit SQL against a real pgvector, so a change that
  # quietly shrinks result sets (the benchmark would still "work") fails here instead.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest -q tests/test_sql_integration.py

  # Vercel functions are limited to 500 MB (dependencies + code + models). Fail well before.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt --target /tmp/site --quiet
          du -sm /tmp/site models app | tee sizes.txt
          total=$(awk '{s += $1} END {print s}' sizes.txt)
          echo "function bundle is about ${total} MB (Vercel limit: 500)"
          [ "$total" -lt 400 ]

  # Builds the image, starts the real stack and runs the smoke test against it: this is what
  # catches broken dependency pins, missing model files, or an API that no longer starts.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health >/dev/null && exit 0
            sleep 5
          done
          docker compose logs api | tail -50
          exit 1
      - name: Redis backend (docker compose)
        run: |
          curl -s localhost:8000/health | grep -q '"cache":"redis"'
          bash scripts/smoke.sh
      # same image with no REDIS_URL, which is how the Vercel deploy runs: the cache and the
      # rate limiter must fall back to Postgres and actually use it
      - name: Postgres backend (no REDIS_URL)
        run: |
          docker run -d --name solo --network retrieval-lab_default \
            -e DATABASE_URL=postgresql://rag:rag@db:5432/rag -p 8001:8000 retrieval-lab-api
          for i in $(seq 1 60); do
            curl -sf localhost:8001/health >/dev/null && break
            sleep 5
          done
          curl -s localhost:8001/health | grep -q '"cache":"postgres"'
          bash scripts/smoke.sh http://localhost:8001
          n=$(docker exec retrieval-lab-db-1 psql -U rag -d rag -tAc "select coalesce(sum(n), 0) from rate_limits")
          echo "rate-limit hits recorded in Postgres: $n"
          [ "$n" -gt 0 ]
      - if: failure()
        run: |
          docker compose logs api | tail -60
          docker logs solo 2>&1 | tail -60

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  # Runs the retrieval SQL against a real pgvector, so a change that quietly shrinks
  # result sets (the benchmark would still "work") fails here instead.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest -q tests/test_sql_integration.py

  # Builds the image, starts the real stack and runs the smoke test against it: this is what
  # catches broken dependency pins or an API that no longer starts.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health >/dev/null && exit 0
            sleep 5
          done
          docker compose logs api | tail -50
          exit 1
      - run: bash scripts/smoke.sh
      # same image with no REDIS_URL: it must start its own Redis and actually use it
      - name: single-container mode (embedded Redis)
        run: |
          docker run -d --name solo --network retrieval-lab_default \
            -e DATABASE_URL=postgresql://rag:rag@db:5432/rag -p 8001:8000 retrieval-lab-api
          for i in $(seq 1 60); do
            curl -sf localhost:8001/health >/dev/null && break
            sleep 5
          done
          bash scripts/smoke.sh http://localhost:8001
          docker exec solo redis-cli ping | grep -q PONG
          docker exec solo redis-cli keys 'rl:*' | grep -q 'rl:'
      - if: failure()
        run: |
          docker compose logs api | tail -60
          docker logs solo 2>&1 | tail -60

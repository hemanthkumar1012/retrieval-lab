name: debug
on:
  push:
    branches: [ci-bench]

jobs:
  cache-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rl .
      - run: bash .github/dbg.sh cache-bench-fixed 30 docker run --rm rl python -m bench.cache_bench --limit 50

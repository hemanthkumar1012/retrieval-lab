name: export-models

# Builds the int8 ONNX models the API runs on, checks them against the original PyTorch
# weights, and commits models/ back to main. Runs when the export script or this file
# changes; the models are not rebuilt on every push.
on:
  push:
    branches: [main, onnx]
    paths:
      - scripts/export_models.py
      - .github/workflows/export-models.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install export tooling
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "optimum[exporters]==1.23.3" sentence-transformers==3.2.1 onnxruntime==1.20.1 \
            numpy==1.26.4 tokenizers==0.20.3 datasets==3.1.0 pyarrow==17.0.0 \
            pydantic==2.9.2 pydantic-settings==2.6.1
      - name: export, quantise, compare with fp32
        run: |
          set +e
          python scripts/export_models.py 2>&1 | tee export.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(tail -n 40 export.log | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=export failed::$msg"
          fi
          exit $code
      - name: show what was produced
        run: ls -l models/*/ && cat models/PARITY.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          git diff --cached --quiet && { echo "models unchanged"; exit 0; }
          git commit -q -m "Add int8 ONNX models and parity report"
          git push origin HEAD:"${GITHUB_REF_NAME}"

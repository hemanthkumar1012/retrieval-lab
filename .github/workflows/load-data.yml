name: load-data

# Loads the SciFact corpus into the database in the DATABASE_URL repo secret (your Supabase
# project). Embedding ~5k abstracts takes a few minutes on a runner.
# Actions tab -> load-data -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: chunking strategy to load
        default: recursive_256

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-bench.txt
      - name: load SciFact
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_POOL_MAX: "4"
        run: |
          if ! python -m bench.load_scifact --strategy "${{ inputs.strategy }}" > load.log 2>&1; then
            # the runner log is not readable from outside; surface the tail as an annotation,
            # with the connection string scrubbed
            tail -n 15 load.log | sed "s|$DATABASE_URL|<DATABASE_URL>|g" | sed -E 's|://[^@ ]*@|://<redacted>@|g' \
              | python -c "import sys,urllib.parse; print('::error title=load failed::' + sys.stdin.read().replace('%','%25').replace('\n','%0A'))"
            exit 1
          fi
          cat load.log

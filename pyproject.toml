[project]
name = "retrieval-lab"
version = "0.1.0"
description = "RAG service with hybrid search, reranking, semantic caching and a reproducible retrieval benchmark"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
